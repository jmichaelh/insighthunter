<svg xmlns="http://www.w3.org/2000/svg" width="980" height="260" viewBox="0 0 980 260">
  <style>
    .box { fill:#eef2ff; stroke:#1e3a8a; stroke-width:2; rx:12; ry:12; }
    .warn { fill:#fee2e2; stroke:#991b1b; stroke-width:2; rx:12; ry:12; }
    .ok { font:700 16px Arial, sans-serif; fill:#1e3a8a; }
    .bad { font:700 16px Arial, sans-serif; fill:#991b1b; }
    .txt { font:13px Arial, sans-serif; fill:#0f172a; }
    .wire { stroke:#2563eb; stroke-width:4; fill:none; }
  </style>
  <rect x="30" y="40" width="430" height="170" class="box"/>
  <text x="56" y="72" class="ok">Correct sequence</text>
  <text x="56" y="104" class="txt">1. Connect battery to controller</text>
  <text x="56" y="130" class="txt">2. Controller powers up and battery type is set</text>
  <text x="56" y="156" class="txt">3. Connect solar panels to controller</text>
  <path d="M280 92 L395 92" class="wire"/>
  <text x="286" y="82" class="txt">Battery first</text>
  <path d="M280 150 L395 150" class="wire"/>
  <text x="292" y="140" class="txt">Panels last</text>

  <rect x="520" y="40" width="430" height="170" class="warn"/>
  <text x="548" y="72" class="bad">Incorrect sequence</text>
  <text x="548" y="104" class="txt">Do not connect panels to controller before battery</text>
  <text x="548" y="130" class="txt">Do not use controller LOAD terminal for inverter</text>
  <text x="548" y="156" class="txt">Do not reverse polarity on battery or PV conductors</text>
</svg>
